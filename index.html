<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Платформа КРИТ — подбор аналогов</title>
<style>
  :root{
    --bg:#f4f6fa; --surface:#fff; --border:#e3e7ef; --text:#18202f; --muted:#667085; --faint:#98a2b3;
    --primary:#f5b800; --primary-h:#dca600; --primary-soft:#fff6d6; --primary-ink:#7a5600; --on-primary:#1c1500; --link:#946500; --link-h:#6f4b00;
    --ok:#15803d; --ok-soft:#e8f6ee; --warn:#b45309; --warn-soft:#fff3df; --bad:#c62839; --bad-soft:#fdecee;
    --info:#1d4ed8; --info-soft:#e8f0ff;
    --side:#121a2c; --side-text:#aab4c8;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); }
  a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
  .app { display:flex; min-height:100vh; }
  .sidebar { width:248px; flex:none; background:var(--side); color:var(--side-text); padding:18px 12px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .side-brand { display:flex; align-items:center; gap:10px; padding:4px 10px 16px; color:#fff; font-weight:600; font-size:16px; }
  .mark { width:30px; height:30px; border-radius:8px; background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:var(--on-primary); }
  .nav-g { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#6f7b94; padding:16px 12px 6px; }
  .nav-i { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:var(--side-text); font-size:14px; }
  .nav-i:hover { background:rgba(255,255,255,.06); color:#fff; text-decoration:none; }
  .nav-i.on { background:rgba(255,255,255,.12); color:#fff; font-weight:500; }
  .nav-i svg { width:18px; height:18px; flex:none; }
  .nav-b { margin-left:auto; background:var(--primary); color:var(--on-primary); border-radius:10px; font-size:11px; font-weight:600; padding:1px 7px; }
  .side-foot { margin-top:auto; padding:12px 12px 2px; font-size:12px; color:#6f7b94; border-top:1px solid rgba(255,255,255,.08); }
  .main { flex:1; min-width:0; padding:28px 32px 48px; }
  .page { max-width:1000px; margin:0 auto; }
  .page-head { margin-bottom:20px; }
  .page-head h1 { margin:0 0 4px; font-size:24px; font-weight:600; letter-spacing:-.01em; }
  .page-head p { margin:0; color:var(--muted); }
  .chip { display:inline-block; font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:2px 10px; margin-top:8px; }
  .menu-btn { display:none; position:fixed; top:12px; left:12px; z-index:40; width:40px; height:40px; padding:0; align-items:center; justify-content:center; font-size:18px; }
  @media (max-width:860px) {
    .sidebar { position:fixed; left:0; top:0; z-index:50; transform:translateX(-100%); transition:transform .2s; }
    .sidebar.open { transform:none; box-shadow:0 0 0 100vmax rgba(15,23,42,.45); }
    .main { padding:64px 16px 32px; }
    .menu-btn { display:flex; }
  }
  button { font:inherit; font-weight:500; color:var(--text); background:var(--surface); border:1px solid var(--border); padding:8px 16px; border-radius:8px; cursor:pointer; transition:background .15s,border-color .15s; }
  button:hover { background:#f1f3f8; border-color:#d3d9e6; }
  button.primary { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
  button.primary:hover { background:var(--primary-h); border-color:var(--primary-h); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input, textarea { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 12px; }
  input:focus, textarea:focus { outline:3px solid #ffeaa6; border-color:var(--primary); }
  .muted { color:var(--muted); }

  .stats { font-size:13px; color:var(--muted); margin-bottom:14px; }
  .search { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:20px; }
  .search textarea { width:100%; min-height:96px; font-size:15px; resize:vertical; }
  .actions { margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .examples { margin-top:16px; }
  .examples-label { font-size:13px; color:var(--muted); margin-bottom:8px; }
  .example { display:inline-block; padding:5px 12px; background:var(--primary-soft); border:1px solid #f3dd8f; border-radius:20px; font-size:12px; color:var(--primary-ink); cursor:pointer; margin:3px 4px 3px 0; }
  .example:hover { background:#ffedb0; }
  .features { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; font-size:14px; margin-bottom:20px; }
  .features .tag { display:inline-block; background:var(--primary-soft); color:var(--primary-ink); padding:2px 10px; border-radius:20px; font-size:12px; margin:3px 4px 3px 0; }
  h2.found { font-size:18px; font-weight:600; margin:0 0 4px; }
  .meta { font-size:12px; color:var(--faint); margin:0 0 14px; }
  .card { background:var(--surface); border:1px solid var(--border); border-left:4px solid #cbd2e0; border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:12px; }
  .card.high { border-left-color:var(--ok); } .card.mid { border-left-color:#d97706; } .card.low { border-left-color:var(--bad); }
  .card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px; }
  .card h3 { margin:0; font-size:16px; font-weight:600; }
  .card .brand { color:var(--muted); font-size:13px; margin-top:2px; }
  .score { font-size:22px; font-weight:700; white-space:nowrap; }
  .score.high { color:var(--ok); } .score.mid { color:var(--warn); } .score.low { color:var(--bad); }
  .card p { margin:4px 0; font-size:13px; color:var(--muted); }
  .card .row { display:flex; gap:20px; margin-top:8px; flex-wrap:wrap; }
  .card .row div { font-size:13px; }
  .card .ok { color:var(--ok); } .card .warn { color:var(--warn); }
  .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:500; margin-top:4px; }
  .badge.full { background:var(--ok-soft); color:var(--ok); }
  .badge.check { background:var(--warn-soft); color:var(--warn); }
  .badge.no { background:var(--bad-soft); color:var(--bad); }
  .offer { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:13px; }
  .linkbtn { background:none; border:none; color:var(--link); padding:6px 0; margin-top:6px; font-size:13px; font-weight:500; }
  .linkbtn:hover { background:none; border:none; color:var(--link-h); text-decoration:underline; }
  .details { display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .details.open { display:block; }
  table.cmp { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:12px; }
  table.cmp th, table.cmp td { border-bottom:1px solid var(--border); padding:6px 8px; text-align:left; }
  table.cmp th { background:#f7f8fb; font-weight:600; color:var(--muted); font-size:12px; }
  td.st-ok { color:var(--ok); } td.st-close { color:var(--warn); } td.st-bad { color:var(--bad); font-weight:600; } td.st-unknown { color:var(--faint); }
  .qrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; font-size:13px; }
  .qrow button { padding:5px 12px; font-size:13px; }
  .qrow input { width:70px; padding:5px 8px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#18202f; color:#fff; padding:10px 18px; border-radius:8px; font-size:14px; display:none; max-width:90%; z-index:60; }
  .empty { text-align:center; color:var(--muted); padding:32px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
  .error { color:var(--bad); padding:16px; background:var(--bad-soft); border-radius:var(--radius); border:1px solid #f6c5cb; }
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn" aria-label="Меню">☰</button>
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main"><div class="page">

<div class="page-head">
  <h1>Подбор аналогов</h1>
  <p>Сертифицированные российские аналоги импортных комплектующих</p>
</div>
<div class="stats" id="stats">Загрузка каталога…</div>

<div class="search">
  <textarea id="query" placeholder="Вставьте характеристики импортной детали. Например: Подшипник SKF 6205-2RS, d=25, D=52, B=15, сталь"></textarea>
  <div class="actions">
    <button class="primary" id="searchBtn">Найти аналоги</button>
    <button id="pdfBtn" type="button">Загрузить PDF-паспорт</button>
    <input type="file" id="pdfInput" accept="application/pdf" hidden>
  </div>
  <div class="examples">
    <div class="examples-label">Примеры запросов</div>
    <div id="examplesList"></div>
  </div>
</div>

<div id="features"></div>
<div id="results"></div>

</div></main></div>
<div class="toast" id="toast"></div>
<script>
window.KritNav = (function () {
  const svg = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
  const ICON = {
    search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
    erp: svg('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'),
    eng: svg('<path d="m9 11 3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>'),
  };
  const ITEMS = [
    { group: 'Закупки' },
    { href: '/', icon: 'search', label: 'Подбор аналогов' },
    { href: '/erp', icon: 'erp', label: 'Заявка в 1С' },
    { group: 'Согласование' },
    { href: '/engineer', icon: 'eng', label: 'Кабинет инженера', badge: true },
  ];
  async function refreshBadge() {
    const el = document.getElementById('navBadge');
    if (!el) return;
    try {
      const r = await fetch('/api/decisions?status=pending');
      const n = (await r.json()).decisions.length;
      el.textContent = n; el.style.display = n ? '' : 'none';
    } catch (e) { el.style.display = 'none'; }
  }
  function mount(active) {
    const sb = document.getElementById('sidebar');
    sb.innerHTML = '<div class="side-brand"><span class="mark">К</span>Платформа КРИТ</div>' +
      ITEMS.map(it => it.group ? `<div class="nav-g">${it.group}</div>` :
        `<a class="nav-i${it.href === active ? ' on' : ''}" href="${it.href}">${ICON[it.icon]}<span>${it.label}</span>` +
        (it.badge ? '<span class="nav-b" id="navBadge" style="display:none"></span>' : '') + '</a>').join('') +
      '<div class="side-foot">Демо-версия · УГТ 3</div>';
    const btn = document.getElementById('menuBtn');
    btn.onclick = e => { e.stopPropagation(); sb.classList.toggle('open'); };
    document.addEventListener('click', e => { if (!sb.contains(e.target)) sb.classList.remove('open'); });
    refreshBadge();
  }
  return { mount, refreshBadge };
})();

KritNav.mount('/');

const queryEl = document.getElementById('query');
const searchBtn = document.getElementById('searchBtn');
const resultsEl = document.getElementById('results');
const featuresEl = document.getElementById('features');
const examplesEl = document.getElementById('examplesList');
const statsEl = document.getElementById('stats');

async function loadStats() {
  try {
    const res = await fetch('/api/catalog/stats');
    const s = await res.json();
    statsEl.textContent = `В каталоге: ${s.total} позиций (${s.import} импортных, ${s.russian} российских)`;
  } catch (e) {
    statsEl.textContent = '';
  }
}

async function loadExamples() {
  try {
    const res = await fetch('/api/examples');
    const data = await res.json();
    data.examples.forEach(ex => {
      const span = document.createElement('span');
      span.className = 'example';
      span.textContent = ex.length > 60 ? ex.slice(0, 60) + '…' : ex;
      span.title = ex;
      span.onclick = () => { queryEl.value = ex; runSearch(); };
      examplesEl.appendChild(span);
    });
  } catch (e) {}
}

function scoreClass(s) {
  if (s >= 80) return 'high';
  if (s >= 60) return 'mid';
  return 'low';
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderFeatures(f) {
  const tags = [];
  f.categories.forEach(c => tags.push(`<span class="tag">${c}</span>`));
  f.materials.forEach(m => tags.push(`<span class="tag">${m}</span>`));
  if (f.inner_diameter != null) tags.push(`<span class="tag">d=${f.inner_diameter}</span>`);
  if (f.outer_diameter != null) tags.push(`<span class="tag">D=${f.outer_diameter}</span>`);
  if (f.width != null) tags.push(`<span class="tag">B=${f.width}</span>`);
  if (f.standard) tags.push(`<span class="tag">${escapeHtml(f.standard)}</span>`);
  ['stroke','pressure','voltage','current','poles','flow','head','power','range_min','range_max','output','ip','variant'].forEach(k => {
    if (f[k] != null) tags.push(`<span class="tag">${k}=${escapeHtml(f[k])}</span>`);
  });
  if (f.article) tags.push(`<span class="tag">арт. ${escapeHtml(f.article)}</span>`);
  if (tags.length === 0) {
    featuresEl.innerHTML = '';
    return;
  }
  featuresEl.innerHTML = `<div class="features"><b>Распознано:</b><br>${tags.join(' ')}</div>`;
}

let lastMatches = [];
const ST = { ok: '✓ совпадает', close: '≈ близко', bad: '✗ не совпадает', unknown: 'нет данных' };

function renderDetails(m) {
  let h = '<table class="cmp"><tr><th>Параметр</th><th>Запрос</th><th>Аналог</th><th>Результат</th></tr>';
  (m.comparison || []).forEach(r => {
    h += `<tr><td>${escapeHtml(r.param)}</td><td>${escapeHtml(r.query)}</td><td>${escapeHtml(r.candidate)}</td><td class="st-${r.status}">${ST[r.status]}</td></tr>`;
  });
  h += '</table>';
  if ((m.offers || []).length) {
    h += '<div style="font-size:13px;font-weight:600;margin-bottom:4px">Предложения поставщиков (демо-данные)</div>';
    m.offers.forEach(o => {
      h += `<div class="qrow"><span>${escapeHtml(o.supplier)}, ${escapeHtml(o.city)}${o.verified ? ' ✓' : ''} · <b>${Number(o.price).toLocaleString('ru-RU')} ₽</b> · ${o.stock > 0 ? 'в наличии ' + o.stock : 'под заказ'} · ${o.lead_days} дн.</span>`;
      h += `<input type="number" min="1" value="1" aria-label="Количество"><button data-quote="${escapeHtml(m.id)}" data-supplier="${escapeHtml(o.supplier)}">Запросить КП</button></div>`;
    });
  }
  return h;
}

function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = 'none'; }, 4000);
}

resultsEl.addEventListener('click', async e => {
  const tg = e.target.closest('[data-toggle]');
  if (tg) { document.getElementById('det' + tg.dataset.toggle).classList.toggle('open'); return; }
  const qb = e.target.closest('[data-quote]');
  if (qb) {
    const qty = parseInt(qb.parentElement.querySelector('input').value, 10) || 1;
    try {
      const res = await fetch('/api/quote-request', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: qb.dataset.quote, supplier: qb.dataset.supplier, qty }) });
      const d = await res.json();
      if (!res.ok) throw new Error(d.detail || 'Ошибка');
      toast(`${d.number}: запрос записан в журнал (демо — поставщику ничего не отправлено)`);
    } catch (err) { toast('Ошибка: ' + err.message); }
  }
});

function renderResults(data) {
  if (data.count === 0) {
    resultsEl.innerHTML = '<div class="empty">Аналоги не найдены. Уточните характеристики или категорию.</div>';
    return;
  }
  let html = `<h2 class="found">Найдено аналогов: ${data.count}</h2>`;
  html += `<div class="meta">${data.filename ? 'Файл: ' + escapeHtml(data.filename) + ' · ' : ''}время подбора ${data.elapsed_ms} мс</div>`;
  lastMatches = data.matches;
  data.matches.forEach((m, idx) => {
    const cls = scoreClass(m.score);
    html += `<div class="card ${cls}">`;
    html += `<div class="card-header"><div>`;
    html += `<h3>${escapeHtml(m.name)}</h3>`;
    html += `<div class="brand">${escapeHtml(m.brand)} • ${escapeHtml(m.category)} • ${escapeHtml(m.material)}</div>`;
    html += `</div><div class="score ${cls}">${m.score}%</div></div>`;
    html += `<p><b>Стандарт:</b> ${escapeHtml(m.standard)}</p>`;
    if (m.verdict) {
      const vc = m.verdict.code === 'full' ? 'full' : (m.verdict.code === 'check' ? 'check' : 'no');
      html += `<span class="badge ${vc}">${escapeHtml(m.verdict.text)}</span>`;
    }
    const o = m.best_offer;
    if (o) {
      html += `<div class="offer"><b>${Number(o.price).toLocaleString('ru-RU')} ₽</b> · ${escapeHtml(o.supplier)}, ${escapeHtml(o.city)}${o.verified ? ' ✓' : ''} · ${o.stock > 0 ? 'в наличии ' + o.stock : 'под заказ'} · срок ${o.lead_days} дн.</div>`;
    }
    if (m.same.length || m.diff.length) {
      html += `<div class="row">`;
      if (m.same.length) html += `<div class="ok">✓ ${m.same.map(escapeHtml).join(' · ')}</div>`;
      if (m.diff.length) html += `<div class="warn">⚠ ${m.diff.map(escapeHtml).join(' · ')}</div>`;
      html += `</div>`;
    }
    html += `<button class="linkbtn" data-toggle="${idx}">Сверка характеристик и поставщики ▾</button>`;
    html += `<div class="details" id="det${idx}">${renderDetails(m)}</div>`;
    html += `</div>`;
  });
  resultsEl.innerHTML = html;
}

async function runSearch() {
  const q = queryEl.value.trim();
  if (!q) return;
  searchBtn.disabled = true;
  resultsEl.innerHTML = '<div class="empty">Поиск…</div>';
  featuresEl.innerHTML = '';

  try {
    const res = await fetch('/api/match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q, top_k: 10 }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || ('Ошибка сервера: ' + res.status));
    }
    const data = await res.json();
    renderFeatures(data.features);
    renderResults(data);
  } catch (err) {
    resultsEl.innerHTML = '<div class="error">Ошибка: ' + escapeHtml(err.message) + '</div>';
  } finally {
    searchBtn.disabled = false;
  }
}

searchBtn.onclick = runSearch;
const pdfInput = document.getElementById('pdfInput');
document.getElementById('pdfBtn').onclick = () => pdfInput.click();
pdfInput.onchange = async () => {
  const file = pdfInput.files[0];
  if (!file) return;
  resultsEl.innerHTML = '<div class="empty">Читаю PDF…</div>';
  featuresEl.innerHTML = '';
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch('/api/extract-pdf', { method: 'POST', body: fd });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || ('Ошибка сервера: ' + res.status));
    }
    const data = await res.json();
    queryEl.value = data.text_preview || '';
    renderFeatures(data.features);
    renderResults(data);
  } catch (err) {
    resultsEl.innerHTML = '<div class="error">Ошибка: ' + escapeHtml(err.message) + '</div>';
  } finally {
    pdfInput.value = '';
  }
};
queryEl.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') runSearch();
});

loadStats();
loadExamples();
</script>

</body>
</html>
